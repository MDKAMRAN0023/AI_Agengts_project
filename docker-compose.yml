
services:

  backend:
    image: agentic-rag-copilot:latest
    container_name: agentic-rag-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 5432

    volumes:
      - "${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface"

    depends_on:
      redis:
        condition: service_healthy

    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000

    restart: unless-stopped

  redis:
    image: redis:7
    container_name: agentic-rag-redis

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  redis_data:
